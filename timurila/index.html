<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timurila</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23060A12'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234FD8F7'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.5' transform='rotate(-25 16 16)' fill='none' stroke='%234FD8F7' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/timurila.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Rooms">
    <a href="#command" data-room="command"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"></ellipse></svg><span>Command</span></a>
    <a href="#markets" data-room="markets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M4.5 8h3v7h-3zM12 3v18M10.5 6h3v9h-3zM18 6v14M16.5 10h3v6h-3z"></path></svg><span>Markets</span></a>
    <a href="#lab" data-room="lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9"></path></svg><span>Lab</span></a>
    <a href="#fleet" data-room="fleet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg><span>Fleet</span></a>
    <a href="#journal" data-room="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"></path></svg><span>Journal</span></a>
    <span class="spacer"></span>
    <a class="classic" href="../index.html" title="Open Classic ASTRA, unchanged"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 10h16"></path></svg><span>Classic</span></a>
  </nav>
  <div class="main">
    <header class="top">
      <div class="brand">
        <span class="logo" title="Your logo goes here" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"></ellipse></svg></span>
        <span class="name">TIMURILA</span>
      </div>
      <button type="button" class="jump" id="jump"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span>Jump to any market or room</span><span class="kbd">Ctrl K</span></button>
      <span class="grow"></span>
      <span class="status" id="status"><i></i><span>Looking for MT5…</span></span>
    </header>

    <section class="room" id="room-command" aria-label="Command"></section>
    <section class="room" id="room-markets" aria-label="Markets"></section>
    <section class="room" id="room-lab" aria-label="Lab"></section>
    <section class="room" id="room-fleet" aria-label="Fleet"></section>
    <section class="room" id="room-journal" aria-label="Journal"></section>
  </div>
</div>

<div class="pal" id="pal" role="dialog" aria-label="Jump to a market or room"><div class="box"><input type="text" placeholder="Type a market or a room" aria-label="Type a market or a room" autocomplete="off"><ul role="listbox"></ul></div></div>

<script src="js/core.js"></script>
<!-- Classic's own engine, loaded unchanged: indicator maths and the Patterns analysis -->
<script src="../js/indicators.js"></script>
<script src="../js/chartpatterns.js"></script>
<script src="../js/jmindicators.js"></script>
<script src="../js/jmmarks.js"></script>
<script src="../js/proind.js"></script>
<script src="../js/studio.js"></script>
<script src="../js/marketmap.js"></script>
<!-- written by research/run.cjs; missing until the first research run has finished -->
<script src="research/results.js" onerror="void 0"></script>
<script src="research/signals.js" onerror="void 0"></script>
<script src="js/evidence.js"></script>
<script src="js/chart.js"></script>
<script src="js/markets.js"></script>
<script src="js/command.js"></script>
<script src="js/lab.js"></script>
<script src="js/shadow.js"></script>
<script src="js/fleet.js"></script>
<script src="js/journal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
